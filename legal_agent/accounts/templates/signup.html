<!DOCTYPE html>
<html>

<head>
    <title>Indian Legal Agent - Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(234, 244, 255, 0.9), rgba(246, 251, 255, 0.95)),
                url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* App Title */
        h1 {
            font-size: 40px;
            font-weight: 700;
            color: #0b3d91;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 4px 12px rgba(11, 61, 145, 0.25);
        }

        /* Glass Card Effect */
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px 35px;
            border-radius: 18px;
            width: 400px;
            text-align: center;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.25);
        }

        h2 {
            color: #1e90ff;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .error {
            color: #ff4d4d;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        /* Glass Inputs */
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.25);
            color: #000;
            transition: 0.3s;
        }

        input::placeholder {
            color: #2c3e50;
        }

        input:focus {
            border-color: #1e90ff;
            outline: none;
            box-shadow: 0 0 10px rgba(30, 144, 255, 0.4);
            background: rgba(255, 255, 255, 0.35);
        }

        /* Button */
        button {
            width: 100%;
            padding: 12px;
            background: #1e90ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #0b78e3;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(30, 144, 255, 0.4);
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: #0b3d91;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Branding -->
    <h1>⚖️ Indian Legal Agent</h1>

    <!-- Glass Signup Card -->
    <div class="card">
        <h2>Create Account</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="username" placeholder="Enter Username" required>
            </div>

            <div class="form-group">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Create Password" required>
            </div>

            <button type="submit">Signup</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/accounts/login/">Login</a>
        </div>
    </div>

</body>

</html>
